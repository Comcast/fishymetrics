{{- if and .Values.httproute.enabled .Values.ingress.enabled }}
  {{- fail "Error: Both httproute and ingress cannot be enabled simultaneously. Set one to false." }}
{{- end }}
{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "fishymetrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fishymetrics.common.metaLabels" . | nindent 4 }}
    {{- include "fishymetrics.common.matchLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.parentRefs.name }}
      namespace: {{ .Values.httproute.parentRefs.namespace }}
      {{- if .Values.httproute.parentRefs.sectionName }}
      sectionName: {{ .Values.httproute.parentRefs.sectionName }}
      {{- end }}
  {{- if .Values.httproute.hostnames }}
  hostnames:
    {{- range $host := .Values.httproute.hostnames }}
    - {{ $host | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ template "fishymetrics.name" . }}
          port: {{ .Values.exporter.port }}
{{- end }}
